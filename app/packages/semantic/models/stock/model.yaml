    type: ratio
    numerator: deposit_balance_sum
    denominator: member_count
    format: currency
    description: Total deposit balance divided by the number of members. Institution level only, because members and deposits are counted at different branches.
    synonyms: [deposits per member, average deposits per member, shares per member, deposits per customer, average deposit per member]
    owner: Finance data team
    dimensions_allowed: []
  member_count:
