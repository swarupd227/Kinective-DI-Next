# DI Next stock semantic model (spec 16). Kinective-owned; tenants pin a version and override or
# extend it in models/tenants/<tenant>/overrides.yaml. Formulas follow the spec 16.5 examples and
# must be confirmed by Kinective's finance specialists (assumption CA-26).
version: 1.0.0

settings:
  delinquency_basis_days:
    type: integer
    default: 60
    description: Days past due at which a loan counts as delinquent for the headline ratio.

# Physical sources. "current" sources read the curated tables as of the last nightly build;
# "history" sources read month-end rollups (FinBI history, spec 14.9).
sources:
  loan_current:
    kind: current
    table: cdm_loan
    alias: l
    joins: ['JOIN cdm_location AS loc ON loc.int_id = l.branch_id']
    filters: ['l.close_date IS NULL', 'l.charge_off_date IS NULL']
    purview_column: l.branch_id
    lineage: [cdm_loan, cdm_location]
  loan_history:
    kind: history
    table: hist_loan_month
    alias: h
    joins: ['JOIN cdm_location AS loc ON loc.int_id = h.branch_id']
    time_column: h.month_end
    purview_column: h.branch_id
    lineage: [hist_loan_month, cdm_location]
  loan_dq_history:
    # Month-end balance by delinquency status, for aging and vintage over time. Charged-off loans are excluded.
    kind: history
    table: hist_loan_dq_month
    alias: hq
    joins: ['JOIN cdm_location AS loc ON loc.int_id = hq.branch_id']
    filters: ["hq.bucket <> 'Charged off'"]
    time_column: hq.month_end
    purview_column: hq.branch_id
    lineage: [hist_loan_dq_month, cdm_location]
  deposit_current:
    kind: current
    table: cdm_deposit_account
    alias: d
    joins: ['JOIN cdm_location AS loc ON loc.int_id = d.branch_id']
    filters: ['d.close_date IS NULL']
    purview_column: d.branch_id
    lineage: [cdm_deposit_account, cdm_location]
  deposit_history:
    kind: history
    table: hist_deposit_month
    alias: hd
    joins: ['JOIN cdm_location AS loc ON loc.int_id = hd.branch_id']
    time_column: hd.month_end
    purview_column: hd.branch_id
    lineage: [hist_deposit_month, cdm_location]
  party_current:
    kind: current
    table: cdm_party
    alias: p
    joins: ['JOIN cdm_location AS loc ON loc.int_id = p.primary_branch_id']
    filters: ['p.is_member = 1']
    purview_column: p.primary_branch_id
    lineage: [cdm_party, cdm_location]
  party_history:
    kind: history
    table: hist_party_month
    alias: hp
    joins: ['JOIN cdm_location AS loc ON loc.int_id = hp.branch_id']
    time_column: hp.month_end
    purview_column: hp.branch_id
    lineage: [hist_party_month, cdm_location]
  member_history:
    kind: history
    table: hist_member_month
    alias: hm
    joins: ['JOIN cdm_location AS loc ON loc.int_id = hm.branch_id']
    time_column: hm.month_end
    purview_column: hm.branch_id
    lineage: [hist_member_month, cdm_party, cdm_deposit_account, cdm_loan, cdm_digital_usage, cdm_location]
  application_history:
    kind: history
    table: hist_lap_month
    alias: ha
    joins: ['JOIN cdm_location AS loc ON loc.int_id = ha.branch_id']
    time_column: ha.month_end
    purview_column: ha.branch_id
    lineage: [hist_lap_month, cdm_loan_application, cdm_location]
  call_report:
    # The latest 5300 the credit union prepared: institution-wide figures, so branch purview sees none.
    kind: current
    table: cr_value
    alias: cv
    filters: ['cv.quarter_end = (SELECT MAX(q.quarter_end) FROM cr_value AS q)']
    purview_column: '0'
    institution_types: [credit_union]
    lineage: [cr_value, cr_line]
  call_report_history:
    # Every quarter's 5300, for trends: board reports read five quarters. Institution-wide, like the latest.
    kind: history
    table: cr_value
    alias: cvh
    time_column: cvh.quarter_end
    purview_column: '0'
    institution_types: [credit_union]
    lineage: [cr_value, cr_line]
  ffiec_report:
    # The bank's latest FFIEC 051 Call Report, institution-wide.
    kind: current
    table: cr_value
    alias: fv
    filters: ['fv.quarter_end = (SELECT MAX(q.quarter_end) FROM cr_value AS q)']
    purview_column: '0'
    institution_types: [bank]
    lineage: [cr_value, cr_line]
  ffiec_history:
    kind: history
    table: cr_value
    alias: fvh
    time_column: fvh.quarter_end
    purview_column: '0'
    institution_types: [bank]
    lineage: [cr_value, cr_line]

dimensions:
  branch:
    label: Branch
    description: The branch that owns the account or member relationship.
    synonyms: [location, office, branches]
    hierarchy: location
    exprs:
      loan_current: loc.name
      loan_history: loc.name
      loan_dq_history: loc.name
      deposit_current: loc.name
      deposit_history: loc.name
      party_current: loc.name
      party_history: loc.name
      member_history: loc.name
      application_history: loc.name
    values_sql: SELECT name FROM cdm_location ORDER BY int_id
  region:
    label: Region
    description: The region a branch belongs to.
    synonyms: [area, market]
    exprs:
      loan_current: loc.region
      loan_history: loc.region
      loan_dq_history: loc.region
      deposit_current: loc.region
      deposit_history: loc.region
      party_current: loc.region
      party_history: loc.region
      member_history: loc.region
      application_history: loc.region
    values_sql: SELECT DISTINCT region FROM cdm_location ORDER BY region
  loan_category:
    label: Loan category
    description: The product family of a loan, such as Auto, Mortgage or HELOC.
    synonyms: [loan type, product, loan product, lending product]
    exprs:
      loan_current: l.loan_category
      loan_history: h.loan_category
      loan_dq_history: hq.loan_category
      application_history: ha.loan_category
    values_sql: SELECT DISTINCT loan_category FROM cdm_loan ORDER BY loan_category
  origination_channel:
    label: Origination channel
    description: Whether a loan came directly from the institution or indirectly through a dealer.
    synonyms: [indirect, direct, dealer, channel]
    exprs:
      loan_current: "CASE WHEN l.is_indirect = 1 THEN 'Indirect' ELSE 'Direct' END"
      loan_history: "CASE WHEN h.is_indirect = 1 THEN 'Indirect' ELSE 'Direct' END"
      loan_dq_history: "CASE WHEN hq.is_indirect = 1 THEN 'Indirect' ELSE 'Direct' END"
    values: [Direct, Indirect]
  delinquency_bucket:
    label: Days past due
    description: How far behind a loan is, in the 5300's aging buckets. 60 days and over is reportable delinquency.
    synonyms: [aging, aging bucket, delinquency bucket, days past due, past due bucket, dpd, buckets, delinquency status]
    exprs:
      loan_current: "CASE WHEN l.days_delinquent >= 360 THEN '360+ days' WHEN l.days_delinquent >= 180 THEN '180–359 days' WHEN l.days_delinquent >= 90 THEN '90–179 days' WHEN l.days_delinquent >= 60 THEN '60–89 days' WHEN l.days_delinquent >= 30 THEN '30–59 days' ELSE 'Current' END"
      loan_dq_history: hq.bucket
    values: [Current, 30–59 days, 60–89 days, 90–179 days, 180–359 days, 360+ days]
  vintage:
    label: Vintage (year opened)
    description: The year the loan was made, to compare how each year's lending performs.
    synonyms: [vintage, origination year, year opened, year booked, cohort, origination cohort]
    exprs:
      loan_current: YEAR(l.open_date)
      loan_dq_history: hq.vintage_year
    values_sql: SELECT DISTINCT YEAR(open_date) FROM cdm_loan ORDER BY 1
  deposit_category:
    label: Deposit category
    labels_by_type: { credit_union: Share category }
    description: The deposit product family, such as savings, checking, money market or certificates.
    synonyms: [deposit type, product type, share type, account type, product]
    exprs:
      deposit_current: d.deposit_category
      deposit_history: hd.deposit_category
    values_sql: SELECT DISTINCT deposit_category FROM cdm_deposit_account ORDER BY deposit_category
  segment:
    label: Member segment
    labels_by_type: { bank: Customer segment }
    description: The relationship segment assigned to the member or customer.
    synonyms: [segment, member type, customer type]
    exprs:
      party_current: p.segment_code
    values_sql: SELECT DISTINCT segment_code FROM cdm_party ORDER BY segment_code
  age_band:
    label: Age band
    description: The member's age at each month-end, in five bands.
    synonyms: [age, age band, age group, generation, by age, young members, older members]
    exprs:
      member_history: hm.age_band
    values: [18–24, 25–34, 35–49, 50–64, 65+]
  credit_score_band:
    label: Credit score band
    description: The borrower's credit score when the loan was made, in the tiers lenders price by. Commercial loans and business credit aren't scored; they carry a risk rating.
    synonyms: [credit score, fico, score band, credit tier, credit quality, prime, subprime, near prime, super prime, by score]
    exprs:
      loan_current: "CASE WHEN l.credit_score IS NULL THEN 'Not scored' WHEN l.credit_score >= 740 THEN 'Super prime (740+)' WHEN l.credit_score >= 680 THEN 'Prime (680–739)' WHEN l.credit_score >= 620 THEN 'Near prime (620–679)' ELSE 'Subprime (under 620)' END"
    values: [Super prime (740+), Prime (680–739), Near prime (620–679), Subprime (under 620), Not scored]
  ltv_band:
    label: Loan-to-value band
    description: The loan amount as a share of the collateral's value when the loan was made (combined for home equity lines). Unsecured loans have none.
    synonyms: [ltv, loan to value, loan-to-value, cltv, collateral coverage, equity, underwater, by ltv]
    exprs:
      loan_current: "CASE WHEN l.ltv IS NULL THEN 'Unsecured' WHEN l.ltv <= 60 THEN '60% or less' WHEN l.ltv <= 80 THEN '61–80%' WHEN l.ltv <= 90 THEN '81–90%' WHEN l.ltv <= 100 THEN '91–100%' ELSE 'Over 100%' END"
    values: ['60% or less', 61–80%, 81–90%, 91–100%, Over 100%, Unsecured]
  term_band:
    label: Loan term
    description: The loan's contractual term when it was made. Credit cards and lines are revolving.
    synonyms: [term, loan term, maturity, length, months, term length, by term, 84 month, 72 month]
    exprs:
      loan_current: "CASE WHEN l.term_months IS NULL THEN 'Revolving' WHEN l.term_months <= 36 THEN 'Up to 3 years' WHEN l.term_months <= 60 THEN '4–5 years' WHEN l.term_months <= 84 THEN '6–7 years' WHEN l.term_months <= 180 THEN '8–15 years' ELSE 'Over 15 years' END"
    values: [Up to 3 years, 4–5 years, 6–7 years, 8–15 years, Over 15 years, Revolving]
  risk_rating:
    label: Risk rating
    description: The commercial loan's internal risk grade. 1 to 5 are pass grades; 6 is special mention, 7 substandard. Consumer loans are scored instead.
    synonyms: [risk rating, risk grade, loan grade, criticized, classified, special mention, substandard, watch list, by grade]
    exprs:
      loan_current: "CASE WHEN l.risk_rating IS NULL THEN 'Not rated' WHEN l.risk_rating <= 5 THEN CONCAT(l.risk_rating, ' Pass') WHEN l.risk_rating = 6 THEN '6 Special mention' WHEN l.risk_rating = 7 THEN '7 Substandard' ELSE '8 Doubtful' END"
    values: [2 Pass, 3 Pass, 4 Pass, 5 Pass, 6 Special mention, 7 Substandard, 8 Doubtful, Not rated]

  loan_source:
    label: Loan source
    description: Where DI gets a loan from. Core is the core system; off-core loans come from a servicer's spreadsheet, such as participations or a purchased pool, and are named for it. Month-end history holds core loans only.
    synonyms: [source, loan source, off-core, off core, core loans, participations, purchased loans, by source, data source]
    exprs:
      loan_current: "COALESCE(l.source, 'Core')"
    values_sql: SELECT DISTINCT COALESCE(source, 'Core') FROM cdm_loan ORDER BY 1

# Aggregations per source. {{ setting.x }} reads a tenant setting; values are never user input.
measures:
  interest_income_annualized_sum:
    unit: usd
    exprs:
      call_report: "SUM(CASE WHEN cv.code = '115' THEN cv.amount * 12 / MONTH(cv.quarter_end) ELSE 0 END)"
      call_report_history: "SUM(CASE WHEN cvh.code = '115' THEN cvh.amount * 12 / MONTH(cvh.quarter_end) ELSE 0 END)"
      ffiec_report: "SUM(CASE WHEN fv.code = 'RIAD4107' THEN fv.amount ELSE 0 END * 12 / MONTH(fv.quarter_end))"
      ffiec_history: "SUM(CASE WHEN fvh.code = 'RIAD4107' THEN fvh.amount ELSE 0 END * 12 / MONTH(fvh.quarter_end))"
  interest_expense_annualized_sum:
    unit: usd
    exprs:
      call_report: "SUM(CASE WHEN cv.code = '350' THEN cv.amount * 12 / MONTH(cv.quarter_end) ELSE 0 END)"
      call_report_history: "SUM(CASE WHEN cvh.code = '350' THEN cvh.amount * 12 / MONTH(cvh.quarter_end) ELSE 0 END)"
      ffiec_report: "SUM(CASE WHEN fv.code = 'RIAD4073' THEN fv.amount ELSE 0 END * 12 / MONTH(fv.quarter_end))"
      ffiec_history: "SUM(CASE WHEN fvh.code = 'RIAD4073' THEN fvh.amount ELSE 0 END * 12 / MONTH(fvh.quarter_end))"
  non_interest_income_annualized_sum:
    unit: usd
    exprs:
      call_report: "SUM(CASE WHEN cv.code = '117' THEN cv.amount * 12 / MONTH(cv.quarter_end) ELSE 0 END)"
      call_report_history: "SUM(CASE WHEN cvh.code = '117' THEN cvh.amount * 12 / MONTH(cvh.quarter_end) ELSE 0 END)"
      ffiec_report: "SUM(CASE WHEN fv.code = 'RIAD4079' THEN fv.amount ELSE 0 END * 12 / MONTH(fv.quarter_end))"
      ffiec_history: "SUM(CASE WHEN fvh.code = 'RIAD4079' THEN fvh.amount ELSE 0 END * 12 / MONTH(fvh.quarter_end))"
  operating_expense_annualized_sum:
    unit: usd
    exprs:
      call_report: "SUM(CASE WHEN cv.code = '671' THEN cv.amount * 12 / MONTH(cv.quarter_end) ELSE 0 END)"
      call_report_history: "SUM(CASE WHEN cvh.code = '671' THEN cvh.amount * 12 / MONTH(cvh.quarter_end) ELSE 0 END)"
      ffiec_report: "SUM(CASE WHEN fv.code = 'RIAD4093' THEN fv.amount ELSE 0 END * 12 / MONTH(fv.quarter_end))"
      ffiec_history: "SUM(CASE WHEN fvh.code = 'RIAD4093' THEN fvh.amount ELSE 0 END * 12 / MONTH(fvh.quarter_end))"
  provision_annualized_sum:
    unit: usd
    exprs:
      call_report: "SUM(CASE WHEN cv.code = 'IS0017' THEN cv.amount * 12 / MONTH(cv.quarter_end) ELSE 0 END)"
      call_report_history: "SUM(CASE WHEN cvh.code = 'IS0017' THEN cvh.amount * 12 / MONTH(cvh.quarter_end) ELSE 0 END)"
      ffiec_report: "SUM(CASE WHEN fv.code = 'RIADJJ33' THEN fv.amount ELSE 0 END * 12 / MONTH(fv.quarter_end))"
      ffiec_history: "SUM(CASE WHEN fvh.code = 'RIADJJ33' THEN fvh.amount ELSE 0 END * 12 / MONTH(fvh.quarter_end))"
  revenue_annualized_sum:
    unit: usd
    exprs:
      # Net interest income plus non-interest income: the efficiency ratio's denominator.
      call_report: "SUM(CASE WHEN cv.code IN ('IS0010', '117') THEN cv.amount * 12 / MONTH(cv.quarter_end) ELSE 0 END)"
      call_report_history: "SUM(CASE WHEN cvh.code IN ('IS0010', '117') THEN cvh.amount * 12 / MONTH(cvh.quarter_end) ELSE 0 END)"
      ffiec_report: "SUM(CASE WHEN fv.code = 'RIAD4074' THEN fv.amount WHEN fv.code = 'RIAD4079' THEN fv.amount ELSE 0 END * 12 / MONTH(fv.quarter_end))"
      ffiec_history: "SUM(CASE WHEN fvh.code = 'RIAD4074' THEN fvh.amount WHEN fvh.code = 'RIAD4079' THEN fvh.amount ELSE 0 END * 12 / MONTH(fvh.quarter_end))"
  funding_sum:
    unit: usd
    exprs:
      # Shares and deposits plus borrowings: what the cost of funds is paid on.
      call_report: "SUM(CASE WHEN cv.code IN ('018', '860C') THEN cv.amount ELSE 0 END)"
      call_report_history: "SUM(CASE WHEN cvh.code IN ('018', '860C') THEN cvh.amount ELSE 0 END)"
      ffiec_report: "SUM(CASE WHEN fv.code = 'RCON2200' THEN fv.amount WHEN fv.code = 'RCON3190' THEN fv.amount ELSE 0 END)"
      ffiec_history: "SUM(CASE WHEN fvh.code = 'RCON2200' THEN fvh.amount WHEN fvh.code = 'RCON3190' THEN fvh.amount ELSE 0 END)"
  loan_balance_sum:
    unit: usd
    exprs:
      loan_current: SUM(l.balance)
      loan_history: SUM(h.balance)
      loan_dq_history: SUM(hq.balance)
  delinquent_30_balance_sum:
    unit: usd
    exprs:
      loan_current: 'SUM(CASE WHEN l.days_delinquent >= 30 THEN l.balance ELSE 0 END)'
      loan_dq_history: "SUM(CASE WHEN hq.bucket <> 'Current' THEN hq.balance ELSE 0 END)"
  delinquent_loan_balance_sum:
    unit: usd
    exprs:
      loan_current: 'SUM(CASE WHEN l.days_delinquent >= {{ setting.delinquency_basis_days }} THEN l.balance ELSE 0 END)'
      loan_history: SUM(h.delinquent_60_balance)
      loan_dq_history: "SUM(CASE WHEN hq.bucket IN ('60–89 days', '90–179 days', '180–359 days', '360+ days') THEN hq.balance ELSE 0 END)"
  loan_count:
    unit: count
    exprs:
      loan_current: COUNT(*)
      loan_history: SUM(h.loan_count)
      loan_dq_history: SUM(hq.loan_count)
  loan_rate_weighted:
    unit: number
    exprs:
      loan_current: SUM(l.rate * l.balance)
  credit_score_weighted:
    unit: number
    exprs:
      loan_current: 'SUM(CASE WHEN l.credit_score IS NOT NULL THEN l.credit_score * l.balance ELSE 0 END)'
  scored_balance_sum:
    unit: usd
    exprs:
      loan_current: 'SUM(CASE WHEN l.credit_score IS NOT NULL THEN l.balance ELSE 0 END)'
  ltv_weighted:
    unit: number
    exprs:
      loan_current: 'SUM(CASE WHEN l.ltv IS NOT NULL THEN l.ltv * l.balance ELSE 0 END)'
  secured_balance_sum:
    unit: usd
    exprs:
      loan_current: 'SUM(CASE WHEN l.ltv IS NOT NULL THEN l.balance ELSE 0 END)'
  subprime_balance_sum:
    unit: usd
    exprs:
      loan_current: 'SUM(CASE WHEN l.credit_score < 620 THEN l.balance ELSE 0 END)'
  high_ltv_balance_sum:
    unit: usd
    exprs:
      loan_current: 'SUM(CASE WHEN l.ltv > 90 THEN l.balance ELSE 0 END)'
  criticized_balance_sum:
    unit: usd
    exprs:
      loan_current: 'SUM(CASE WHEN l.risk_rating >= 6 THEN l.balance ELSE 0 END)'
  rated_balance_sum:
    unit: usd
    exprs:
      loan_current: 'SUM(CASE WHEN l.risk_rating IS NOT NULL THEN l.balance ELSE 0 END)'
  term_weighted:
    unit: number
    exprs:
      loan_current: 'SUM(CASE WHEN l.term_months IS NOT NULL THEN l.term_months * l.balance ELSE 0 END)'
  termed_balance_sum:
    unit: usd
    exprs:
      loan_current: 'SUM(CASE WHEN l.term_months IS NOT NULL THEN l.balance ELSE 0 END)'
  new_loan_amount_sum:
    unit: usd
    flow: true
    exprs:
      loan_history: SUM(h.new_loan_amount)
  new_loan_count_sum:
    unit: count
    flow: true
    exprs:
      loan_history: SUM(h.new_loan_count)
  deposit_balance_sum:
    unit: usd
    exprs:
      deposit_current: SUM(d.balance)
      deposit_history: SUM(hd.balance)
  deposit_rate_weighted:
    unit: number
    exprs:
      deposit_current: SUM(d.rate * d.balance)
      deposit_history: SUM(hd.rate_weighted)
  new_loan_rate_weighted:
    unit: number
    flow: true
    exprs:
      loan_history: SUM(h.new_rate_weighted)
  deposit_account_count:
    unit: count
    exprs:
      deposit_current: COUNT(*)
      deposit_history: SUM(hd.account_count)
  net_worth_sum:
    unit: usd
    exprs:
      call_report: "SUM(CASE WHEN cv.code = '997' THEN cv.amount ELSE 0 END)"

      call_report_history: "SUM(CASE WHEN cvh.code = '997' THEN cvh.amount ELSE 0 END)"
      ffiec_report: "SUM(CASE WHEN fv.code = 'RCON8274' THEN fv.amount ELSE 0 END)"
      ffiec_history: "SUM(CASE WHEN fvh.code = 'RCON8274' THEN fvh.amount ELSE 0 END)"
  net_worth_assets_sum:
    unit: usd
    exprs:
      call_report: "SUM(CASE WHEN cv.code = 'NW0010' THEN cv.amount ELSE 0 END)"

      call_report_history: "SUM(CASE WHEN cvh.code = 'NW0010' THEN cvh.amount ELSE 0 END)"
      ffiec_report: "SUM(CASE WHEN fv.code = 'RCONA224' THEN fv.amount ELSE 0 END)"
      ffiec_history: "SUM(CASE WHEN fvh.code = 'RCONA224' THEN fvh.amount ELSE 0 END)"
  risk_weighted_assets_sum:
    # DI's Basel III estimate: each Call Report line at its effective risk weight, the same weights as
    # di-core's BaselService (a test keeps the two equal). Banks only.
    #   1: multifamily, CRE, consumer, premises, other assets   0.5: first-lien 1-4 family; past due 90+ and nonaccrual (+50 points)
    #   0.155: securities at amortized cost (Treasuries and Ginnie 0%, agency and GO munis 20%, revenue munis 50%)
    #   0.13: cash (35% currency at 0%, 65% due from banks at 20%)
    #   1.3 HELOCs, 1.095 C&I, 1.325 construction: the loans plus their unused commitments after conversion
    unit: usd
    exprs:
      ffiec_report: "SUM(fv.amount * CASE WHEN fv.code IN ('RCON1460', 'RCONF160', 'RCONF161', 'RCONB538', 'RCONK137', 'RCONK207', 'RCON2145', 'RCON2160') THEN 1 WHEN fv.code IN ('RCON5367', 'RCON1407', 'RCON1403') THEN 0.5 WHEN fv.code IN ('RCON1754', 'RCON1772') THEN 0.155 WHEN fv.code IN ('RCON0081') THEN 0.13 WHEN fv.code IN ('RCON1797') THEN 1.3 WHEN fv.code IN ('RCON1766') THEN 1.095 WHEN fv.code IN ('RCONF159') THEN 1.325 ELSE 0 END)"
      ffiec_history: "SUM(fvh.amount * CASE WHEN fvh.code IN ('RCON1460', 'RCONF160', 'RCONF161', 'RCONB538', 'RCONK137', 'RCONK207', 'RCON2145', 'RCON2160') THEN 1 WHEN fvh.code IN ('RCON5367', 'RCON1407', 'RCON1403') THEN 0.5 WHEN fvh.code IN ('RCON1754', 'RCON1772') THEN 0.155 WHEN fvh.code IN ('RCON0081') THEN 0.13 WHEN fvh.code IN ('RCON1797') THEN 1.3 WHEN fvh.code IN ('RCON1766') THEN 1.095 WHEN fvh.code IN ('RCONF159') THEN 1.325 ELSE 0 END)"
  cet1_capital_sum:
    unit: usd
    exprs:
      ffiec_report: "SUM(CASE WHEN fv.code = 'RCONP742' THEN fv.amount ELSE 0 END)"
      ffiec_history: "SUM(CASE WHEN fvh.code = 'RCONP742' THEN fvh.amount ELSE 0 END)"
  net_income_annualized_sum:
    unit: usd
    exprs:
      # Year-to-date net income scaled to a full year: nine months at Q3 count 12/9.
      call_report: "SUM(CASE WHEN cv.code = '661A' THEN cv.amount * 12 / MONTH(cv.quarter_end) ELSE 0 END)"

      call_report_history: "SUM(CASE WHEN cvh.code = '661A' THEN cvh.amount * 12 / MONTH(cvh.quarter_end) ELSE 0 END)"
      ffiec_report: "SUM(CASE WHEN fv.code = 'RIAD4340' THEN fv.amount ELSE 0 END * 12 / MONTH(fv.quarter_end))"
      ffiec_history: "SUM(CASE WHEN fvh.code = 'RIAD4340' THEN fvh.amount ELSE 0 END * 12 / MONTH(fvh.quarter_end))"
  net_interest_income_annualized_sum:
    unit: usd
    exprs:
      call_report: "SUM(CASE WHEN cv.code = 'IS0010' THEN cv.amount * 12 / MONTH(cv.quarter_end) ELSE 0 END)"

      call_report_history: "SUM(CASE WHEN cvh.code = 'IS0010' THEN cvh.amount * 12 / MONTH(cvh.quarter_end) ELSE 0 END)"
      ffiec_report: "SUM(CASE WHEN fv.code = 'RIAD4074' THEN fv.amount ELSE 0 END * 12 / MONTH(fv.quarter_end))"
      ffiec_history: "SUM(CASE WHEN fvh.code = 'RIAD4074' THEN fvh.amount ELSE 0 END * 12 / MONTH(fvh.quarter_end))"
  net_charge_off_annualized_sum:
    unit: usd
    exprs:
      call_report: "SUM(CASE WHEN cv.code = '550' THEN cv.amount WHEN cv.code = '551' THEN -cv.amount ELSE 0 END * 12 / MONTH(cv.quarter_end))"

      call_report_history: "SUM(CASE WHEN cvh.code = '550' THEN cvh.amount WHEN cvh.code = '551' THEN -cvh.amount ELSE 0 END * 12 / MONTH(cvh.quarter_end))"
      ffiec_report: "SUM(CASE WHEN fv.code = 'RIAD4635' THEN fv.amount WHEN fv.code = 'RIAD4605' THEN -fv.amount ELSE 0 END * 12 / MONTH(fv.quarter_end))"
      ffiec_history: "SUM(CASE WHEN fvh.code = 'RIAD4635' THEN fvh.amount WHEN fvh.code = 'RIAD4605' THEN -fvh.amount ELSE 0 END * 12 / MONTH(fvh.quarter_end))"
  call_report_loans_sum:
    unit: usd
    exprs:
      call_report: "SUM(CASE WHEN cv.code = '025B' THEN cv.amount ELSE 0 END)"

      call_report_history: "SUM(CASE WHEN cvh.code = '025B' THEN cvh.amount ELSE 0 END)"
      ffiec_report: "SUM(CASE WHEN fv.code = 'RCON2122' THEN fv.amount ELSE 0 END)"
      ffiec_history: "SUM(CASE WHEN fvh.code = 'RCON2122' THEN fvh.amount ELSE 0 END)"
  average_loans_sum:
    unit: usd
    exprs:
      # NCUA's average loans: this quarter's total loans (025B) and last year-end's, averaged. The
      # year-end comes from the month-end loan history, which ties to the 5300.
      call_report: "(SUM(CASE WHEN cv.code = '025B' THEN cv.amount ELSE 0 END) + (SELECT SUM(ye.balance) FROM hist_loan_month AS ye WHERE ye.month_end = (SELECT MAX(m.month_end) FROM hist_loan_month AS m WHERE m.month_end < MAKEDATE(YEAR((SELECT MAX(q.quarter_end) FROM cr_value AS q)), 1)))) / 2"

      call_report_history: "SUM(CASE WHEN cvh.code = '025B' THEN (cvh.amount + COALESCE((SELECT ye.amount FROM cr_value AS ye WHERE ye.code = '025B' AND ye.quarter_end = MAKEDATE(YEAR(cvh.quarter_end), 1) - INTERVAL 1 DAY), cvh.amount)) / 2 ELSE 0 END)"
      ffiec_report: "SUM(CASE WHEN fv.code = 'RCON2122' THEN (fv.amount + COALESCE((SELECT ye.amount FROM cr_value AS ye WHERE ye.code = 'RCON2122' AND ye.quarter_end = MAKEDATE(YEAR(fv.quarter_end), 1) - INTERVAL 1 DAY), fv.amount)) / 2 ELSE 0 END)"
      ffiec_history: "SUM(CASE WHEN fvh.code = 'RCON2122' THEN (fvh.amount + COALESCE((SELECT ye.amount FROM cr_value AS ye WHERE ye.code = 'RCON2122' AND ye.quarter_end = MAKEDATE(YEAR(fvh.quarter_end), 1) - INTERVAL 1 DAY), fvh.amount)) / 2 ELSE 0 END)"
  allowance_sum:
    unit: usd
    exprs:
      call_report: "SUM(CASE WHEN cv.code = 'AS0048' THEN cv.amount ELSE 0 END)"

      call_report_history: "SUM(CASE WHEN cvh.code = 'AS0048' THEN cvh.amount ELSE 0 END)"
      ffiec_report: "SUM(CASE WHEN fv.code = 'RCON3123' THEN fv.amount ELSE 0 END)"
      ffiec_history: "SUM(CASE WHEN fvh.code = 'RCON3123' THEN fvh.amount ELSE 0 END)"
  call_report_dq60_sum:
    unit: usd
    exprs:
      call_report: "SUM(CASE WHEN cv.code = '041B' THEN cv.amount ELSE 0 END)"

      call_report_history: "SUM(CASE WHEN cvh.code = '041B' THEN cvh.amount ELSE 0 END)"
      ffiec_report: "SUM(CASE WHEN fv.code = 'RCON1407' THEN fv.amount WHEN fv.code = 'RCON1403' THEN fv.amount ELSE 0 END)"
      ffiec_history: "SUM(CASE WHEN fvh.code = 'RCON1407' THEN fvh.amount WHEN fvh.code = 'RCON1403' THEN fvh.amount ELSE 0 END)"
  call_report_assets_sum:
    unit: usd
    exprs:
      call_report: "SUM(CASE WHEN cv.code = '010' THEN cv.amount ELSE 0 END)"

      call_report_history: "SUM(CASE WHEN cvh.code = '010' THEN cvh.amount ELSE 0 END)"
      ffiec_report: "SUM(CASE WHEN fv.code = 'RCON2170' THEN fv.amount ELSE 0 END)"
      ffiec_history: "SUM(CASE WHEN fvh.code = 'RCON2170' THEN fvh.amount ELSE 0 END)"
  maturing_90_balance_sum:
    unit: usd
    exprs:
      # Measured from the build's as-of date, not today, so it matches every other figure.
      deposit_current: 'SUM(CASE WHEN d.maturity_date >= (SELECT MAX(mb.as_of_date) FROM meta_build AS mb) AND d.maturity_date < DATE_ADD((SELECT MAX(mb.as_of_date) FROM meta_build AS mb), INTERVAL 90 DAY) THEN d.balance ELSE 0 END)'
  member_count:
    unit: count
    exprs:
      party_current: COUNT(*)
      party_history: SUM(hp.member_count)
      member_history: SUM(hm.member_count)
  member_month_sum:
    unit: count
    flow: true
    exprs:
      party_history: SUM(hp.member_count)
  closed_member_count_sum:
    unit: count
    flow: true
    exprs:
      party_history: SUM(hp.closed_member_count)
  closed_member_annualized_sum:
    unit: count
    flow: true
    exprs:
      party_history: SUM(hp.closed_member_count) * 12
  net_new_member_count_sum:
    unit: count
    flow: true
    exprs:
      party_history: SUM(hp.new_member_count - hp.closed_member_count)
  member_count_sum_hm:
    unit: count
    exprs:
      member_history: SUM(hm.member_count)
  checking_member_sum:
    unit: count
    exprs:
      member_history: SUM(hm.with_checking)
  loan_member_sum:
    unit: count
    exprs:
      member_history: SUM(hm.with_loan)
  direct_deposit_member_sum:
    unit: count
    exprs:
      member_history: SUM(hm.with_direct_deposit)
  digital_member_sum:
    unit: count
    exprs:
      member_history: SUM(hm.digital_active)
  product_sum:
    unit: count
    exprs:
      member_history: SUM(hm.product_count)
  new_member_count_sum:
    unit: count
    flow: true
    exprs:
      party_history: SUM(hp.new_member_count)
  application_count_sum:
    unit: count
    flow: true
    exprs:
      application_history: SUM(ha.application_count)
  approved_application_count_sum:
    unit: count
    flow: true
    exprs:
      application_history: SUM(ha.approved_count)
  decided_application_count_sum:
    unit: count
    flow: true
    exprs:
      application_history: SUM(ha.decided_count)

metrics:
  loan_balance:
    label: Total loan balance
    type: simple
    measure: loan_balance_sum
    format: currency
    description: Sum of the current balance of every open loan. Closed and charged-off loans are excluded.
    synonyms: [loans, total loans, loans outstanding, loan portfolio, loan book, lending, loan growth, loan balances]
    owner: Finance data team
    dimensions_allowed: [branch, region, loan_category, origination_channel, delinquency_bucket, vintage, credit_score_band, ltv_band, term_band, risk_rating, loan_source]
  loan_count:
    label: Number of open loans
    type: simple
    measure: loan_count
    format: count
    description: Count of open loans. Closed and charged-off loans are excluded.
    synonyms: [loan count, how many loans, number of loans, loans open]
    owner: Finance data team
    dimensions_allowed: [branch, region, loan_category, origination_channel, delinquency_bucket, vintage, loan_source]
  delinquency_ratio_60_plus:
    label: Delinquency ratio (60+ days)
    type: ratio
    numerator: delinquent_loan_balance_sum
    denominator: loan_balance_sum
    format: percent_2
    description: Balance of open loans 60 or more days past due, divided by the balance of all open loans.
    regulatory_basis: NCUA 5300 basis - loans 60 or more days delinquent divided by total loans and leases, at period end. Charged-off loans are excluded.
    synonyms: [delinquency, delinquency rate, dq, past due, 60+, late loans, delinquent loans, loans that are behind, behind on payments, behind]
    owner: Finance data team
    dimensions_allowed: [branch, region, loan_category, origination_channel, delinquency_bucket, vintage, credit_score_band, ltv_band, term_band, risk_rating, loan_source]
  delinquency_ratio_30_plus:
    label: Delinquency ratio (30+ days)
    type: ratio
    numerator: delinquent_30_balance_sum
    denominator: loan_balance_sum
    format: percent_2
    description: Balance of open loans 30 or more days past due, divided by the balance of all open loans. An earlier signal than the 60+ ratio NCUA reports.
    synonyms: [30+, 30 plus, 30 day delinquency, thirty day delinquency, early delinquency, 30+ delinquency]
    requires_any: ['30']
    owner: Finance data team
    dimensions_allowed: [branch, region, loan_category, origination_channel, vintage, credit_score_band, ltv_band, term_band, risk_rating, loan_source]
  delinquent_loan_balance:
    label: Delinquent loan balance (60+ days)
    type: simple
    measure: delinquent_loan_balance_sum
    format: currency
    description: Balance of open loans 60 or more days past due.
    synonyms: [delinquent balance, past due balance, dollars delinquent]
    owner: Finance data team
    dimensions_allowed: [branch, region, loan_category, origination_channel, delinquency_bucket, vintage, loan_source]
  average_loan_rate:
    label: Weighted average loan rate
    type: ratio
    numerator: loan_rate_weighted
    denominator: loan_balance_sum
    format: rate
    description: Interest rate of open loans, weighted by balance.
    synonyms: [loan yield, average rate, interest rate, loan rate, pricing]
    owner: Finance data team
    dimensions_allowed: [branch, region, loan_category, origination_channel, credit_score_band, ltv_band, term_band, risk_rating, loan_source]
    current_only: true
  average_credit_score:
    label: Weighted average credit score
    type: ratio
    numerator: credit_score_weighted
    denominator: scored_balance_sum
    format: count
    description: The borrower's credit score when each consumer loan was made, weighted by today's balance. Commercial loans aren't scored.
    synonyms: [average credit score, average fico, wa fico, weighted fico, credit score, fico, credit quality, average score]
    owner: Credit risk team
    dimensions_allowed: [branch, region, loan_category, origination_channel, vintage, credit_score_band, ltv_band, term_band, risk_rating, loan_source]
    current_only: true
  average_ltv:
    label: Weighted average loan-to-value
    type: ratio
    numerator: ltv_weighted
    denominator: secured_balance_sum
    format: rate
    description: Loan amount as a share of the collateral's value when each secured loan was made, weighted by today's balance.
    synonyms: [average ltv, wa ltv, weighted ltv, ltv, loan to value, loan-to-value, cltv]
    owner: Credit risk team
    dimensions_allowed: [branch, region, loan_category, origination_channel, vintage, credit_score_band, ltv_band, term_band, risk_rating, loan_source]
    current_only: true
  subprime_share:
    label: Subprime share of scored loans
    type: ratio
    numerator: subprime_balance_sum
    denominator: scored_balance_sum
    format: percent_1
    description: Balance of consumer loans made to borrowers scoring under 620, as a share of all scored consumer loans.
    synonyms: [subprime, subprime share, subprime exposure, below 620, weak credit, low credit score]
    owner: Credit risk team
    dimensions_allowed: [branch, region, loan_category, origination_channel, vintage, ltv_band, term_band, loan_source]
    current_only: true
  high_ltv_share:
    label: High-LTV share of secured loans
    type: ratio
    numerator: high_ltv_balance_sum
    denominator: secured_balance_sum
    format: percent_1
    description: Balance of secured loans made above 90% loan-to-value, as a share of all secured loans.
    synonyms: [high ltv, over 90% ltv, high loan to value, thin equity, high ltv share]
    owner: Credit risk team
    dimensions_allowed: [branch, region, loan_category, origination_channel, vintage, credit_score_band, term_band, loan_source]
    current_only: true
  criticized_loan_ratio:
    label: Criticized commercial loans
    type: ratio
    numerator: criticized_balance_sum
    denominator: rated_balance_sum
    format: percent_2
    description: Commercial loans rated special mention or worse (6 and over), as a share of all rated commercial loans.
    synonyms: [criticized, criticized loans, classified, classified loans, special mention, substandard, watch list, criticized assets]
    owner: Credit risk team
    dimensions_allowed: [branch, region, loan_category, vintage, ltv_band, term_band, risk_rating, loan_source]
    current_only: true
  average_term:
    label: Weighted average term (months)
    type: ratio
    numerator: term_weighted
    denominator: termed_balance_sum
    format: count
    description: Contractual term of installment loans when they were made, in months, weighted by today's balance. Revolving credit has none.
    synonyms: [average term, wa term, loan term, term, average maturity, months]
    owner: Credit risk team
    dimensions_allowed: [branch, region, loan_category, origination_channel, vintage, credit_score_band, ltv_band, term_band, risk_rating, loan_source]
    current_only: true
  new_loan_amount:
    label: New loan dollars
    type: simple
    measure: new_loan_amount_sum
    format: currency
    description: Original amount of loans opened in the period. Complete months only.
    synonyms: [originations, new loans, loan production, new lending, funded loans, booked loans, new loan volume]
    owner: Lending data team
    dimensions_allowed: [branch, region, loan_category, origination_channel]
  new_loan_count:
    label: New loans opened
    type: simple
    measure: new_loan_count_sum
    format: count
    description: Number of loans opened in the period. Complete months only.
    synonyms: [number of new loans, loans opened, originations count]
    owner: Lending data team
    dimensions_allowed: [branch, region, loan_category, origination_channel]
  deposit_balance:
    label: Total deposit balance
    labels_by_type: { credit_union: Total share balance }
    type: simple
    measure: deposit_balance_sum
    format: currency
    description: Sum of the balance of every open deposit account.
    synonyms: [deposits, shares, total shares, total deposits, deposit balances, savings, funding]
    owner: Finance data team
    dimensions_allowed: [branch, region, deposit_category]
  deposit_account_count:
    label: Number of deposit accounts
    labels_by_type: { credit_union: Number of share accounts }
    type: simple
    measure: deposit_account_count
    format: count
    description: Count of open deposit accounts.
    synonyms: [accounts, deposit accounts, share accounts, how many accounts]
    owner: Finance data team
    dimensions_allowed: [branch, region, deposit_category]
  certificates_maturing_90_days:
    label: Certificates maturing in the next 90 days
    type: simple
    measure: maturing_90_balance_sum
    format: currency
    description: Balance of open certificates whose maturity date falls within 90 days of the build's as-of date. The liquidity question for ALCO is how much of it renews.
    synonyms: [maturing certificates, certificates maturing, certificate maturities, maturities, upcoming maturities, CDs maturing, maturing CDs, time deposits maturing]
    owner: Finance data team
    dimensions_allowed: [branch, region, deposit_category]
    current_only: true
    requires_any: [matur, renew, rolling off]
  net_worth_ratio:
    label: Net worth ratio
    labels_by_type: { bank: Tier 1 leverage ratio }
    type: ratio
    numerator: net_worth_sum
    denominator: net_worth_assets_sum
    format: percent_2
    description: Total net worth (5300 account 997) divided by total assets (NW0010), from the latest 5300. Seven percent or more is well capitalized.
    regulatory_basis: NCUA 5300 Schedule G account 998; PCA categories under 12 CFR 702.102.
    synonyms: [net worth, capital ratio, capital, well capitalized, capitalization, pca, prompt corrective action, leverage ratio, cculr]
    owner: Finance data team
    dimensions_allowed: []
  cet1_ratio:
    label: CET1 ratio
    institution_types: [bank]
    type: ratio
    numerator: cet1_capital_sum
    denominator: risk_weighted_assets_sum
    format: percent_2
    description: Common equity tier 1 capital (RC-R RCONP742, equity less AOCI under the opt-out election) divided by risk-weighted assets, DI's Basel III estimate from the Call Report. The minimum is 4.5%, 7% with the conservation buffer, and 6.5% is well capitalized.
    regulatory_basis: Basel III standardized approach, 12 CFR 3, 217 and 324; a bank on the community bank leverage ratio does not file it (RC-R Part II).
    synonyms: [cet1, cet 1, cet1 ratio, common equity tier 1, common equity tier 1 ratio, common equity ratio, risk-based capital, risk based capital, basel iii]
    requires_any: [cet, common equity, risk-based, risk based, basel]
    owner: Finance data team
    dimensions_allowed: []
  risk_weighted_assets:
    label: Risk-weighted assets
    institution_types: [bank]
    type: simple
    measure: risk_weighted_assets_sum
    format: currency
    description: Every asset and unused commitment weighted by its risk under the Basel III standardized approach, DI's estimate from the Call Report and the assumptions shown with the Basel III capital report.
    regulatory_basis: Basel III standardized approach, 12 CFR 3, 217 and 324.
    synonyms: [risk-weighted assets, risk weighted assets, rwa, rwas]
    requires_any: [risk-weighted, risk weighted, rwa]
    owner: Finance data team
    dimensions_allowed: []
  return_on_assets:
    label: Return on assets (ROA)
    type: ratio
    numerator: net_income_annualized_sum
    denominator: call_report_assets_sum
    format: percent_2
    description: Year-to-date net income (5300 account 661A), annualized, divided by total assets (010), from the latest 5300.
    regulatory_basis: NCUA Financial Performance Report earnings ratio, from 5300 accounts 661A and 010.
    synonyms: [roa, return on assets, profitability, earnings ratio, net income ratio]
    requires_any: [roa, return, profitab, earning]
    owner: Finance data team
    dimensions_allowed: []
  net_interest_margin:
    label: Net interest margin (NIM)
    type: ratio
    numerator: net_interest_income_annualized_sum
    denominator: call_report_assets_sum
    format: percent_2
    description: Year-to-date net interest income (5300 account IS0010, interest income less dividends and interest expense), annualized, divided by total assets (010), from the latest 5300.
    regulatory_basis: NCUA Financial Performance Report net interest margin, from 5300 accounts IS0010 and 010.
    synonyms: [nim, net interest margin, margin, interest margin, spread, net interest income ratio]
    requires_any: [nim, margin, spread]
    owner: Finance data team
    dimensions_allowed: []
  net_charge_off_ratio:
    label: Net charge-offs to average loans
    type: ratio
    numerator: net_charge_off_annualized_sum
    denominator: average_loans_sum
    format: percent_2
    description: Year-to-date charge-offs less recoveries (5300 accounts 550 and 551), annualized, divided by average loans, the mean of this quarter's total loans (025B) and last year-end's.
    regulatory_basis: NCUA Financial Performance Report net charge-offs to average loans.
    synonyms: [net charge-offs, nco, charge-off ratio, charge-offs, loan losses, loss rate]
    requires_any: [charge, nco, loss]
    owner: Finance data team
    dimensions_allowed: []
  allowance_coverage:
    label: Allowance coverage of delinquent loans
    labels_by_type: { bank: Allowance coverage of noncurrent loans }
    type: ratio
    numerator: allowance_sum
    denominator: call_report_dq60_sum
    format: percent_1
    description: The allowance for credit losses on loans (5300 account AS0048) as a share of loans 60 or more days delinquent (041B), from the latest 5300. Above 100% means the allowance exceeds reportable delinquency.
    synonyms: [allowance coverage, acl coverage, reserve coverage, alll coverage, coverage ratio, allowance]
    requires_any: [allowance, acl, reserve, alll, coverage]
    owner: Finance data team
    dimensions_allowed: []
  net_interest_income:
    label: Net interest income
    type: simple
    measure: net_interest_income_annualized_sum
    format: currency
    description: Interest income less dividends and interest expense, year to date from the 5300 (IS0010) and annualized.
    synonyms: [net interest income, nii, interest margin dollars, spread income]
    requires_any: [net interest income, nii]
    owner: Finance data team
    dimensions_allowed: []
  non_interest_income:
    label: Non-interest income
    type: simple
    measure: non_interest_income_annualized_sum
    format: currency
    description: Fees, interchange, gains on loan sales and other income, year to date from the 5300 (117) and annualized.
    synonyms: [non-interest income, noninterest income, fee income, fees, other income, interchange income]
    requires_any: [non-interest, noninterest, fee income, fees, interchange, other income]
    owner: Finance data team
    dimensions_allowed: []
  operating_expense:
    label: Operating expense
    type: simple
    measure: operating_expense_annualized_sum
    format: currency
    description: Salaries and benefits, occupancy, operations and every other non-interest expense, year to date from the 5300 (671) and annualized.
    synonyms: [operating expense, operating expenses, opex, non-interest expense, noninterest expense, overhead, expenses]
    requires_any: [operating, opex, non-interest expense, noninterest expense, overhead, expense]
    owner: Finance data team
    dimensions_allowed: []
  provision_expense:
    label: Provision for credit losses
    type: simple
    measure: provision_annualized_sum
    format: currency
    description: Credit loss expense, year to date from the 5300 (IS0017) and annualized.
    synonyms: [provision, provision for credit losses, provision expense, credit loss expense, pll, loan loss provision]
    requires_any: [provision, credit loss expense, pll]
    owner: Finance data team
    dimensions_allowed: []
  net_income:
    label: Net income
    type: simple
    measure: net_income_annualized_sum
    format: currency
    description: Year-to-date net income from the 5300 (661A), annualized.
    synonyms: [net income, earnings, profit, bottom line]
    requires_any: [net income, earnings, profit, bottom line]
    owner: Finance data team
    dimensions_allowed: []
  efficiency_ratio:
    label: Efficiency ratio
    type: ratio
    numerator: operating_expense_annualized_sum
    denominator: revenue_annualized_sum
    format: percent_1
    description: Operating expense as a share of net interest income plus non-interest income, from the 5300. Lower is better; most credit unions run 70% to 85%.
    regulatory_basis: NCUA Financial Performance Report basis - operating expenses over net interest income plus fee and other operating income.
    synonyms: [efficiency ratio, efficiency, cost to income, cost-to-income, overhead ratio]
    requires_any: [efficiency, cost to income, cost-to-income, overhead ratio]
    owner: Finance data team
    dimensions_allowed: []
  operating_expense_ratio:
    label: Operating expense to assets
    type: ratio
    numerator: operating_expense_annualized_sum
    denominator: call_report_assets_sum
    format: percent_2
    description: Annualized operating expense over total assets, from the 5300.
    synonyms: [operating expense ratio, operating expense to assets, opex ratio, expense ratio]
    requires_any: [operating expense ratio, operating expense to assets, opex ratio, expense ratio]
    owner: Finance data team
    dimensions_allowed: []
  non_interest_income_ratio:
    label: Non-interest income to assets
    type: ratio
    numerator: non_interest_income_annualized_sum
    denominator: call_report_assets_sum
    format: percent_2
    description: Annualized fee and other income over total assets, from the 5300.
    synonyms: [fee income ratio, non-interest income to assets, noninterest income ratio]
    requires_any: [fee income ratio, non-interest income to assets, noninterest income ratio, fee ratio]
    owner: Finance data team
    dimensions_allowed: []
  yield_on_assets:
    label: Yield on assets
    type: ratio
    numerator: interest_income_annualized_sum
    denominator: call_report_assets_sum
    format: percent_2
    description: Annualized interest and investment income over total assets, from the 5300.
    synonyms: [yield on assets, asset yield, interest income ratio]
    requires_any: [yield on assets, asset yield]
    owner: Finance data team
    dimensions_allowed: []
  cost_of_funds:
    label: Cost of funds
    type: ratio
    numerator: interest_expense_annualized_sum
    denominator: funding_sum
    format: percent_2
    description: Annualized dividends and interest expense over shares, deposits and borrowings, from the 5300.
    synonyms: [cost of funds, funding cost, dividend cost, total cost of funds]
    requires_any: [cost of funds, funding cost, dividend cost]
    owner: Finance data team
    dimensions_allowed: []
  cost_of_deposits:
    label: Cost of deposits
    labels_by_type: { credit_union: Cost of shares and deposits }
    type: ratio
    numerator: deposit_rate_weighted
    denominator: deposit_balance_sum
    format: rate
    description: Rate paid on deposits, weighted by balance, at each month-end. Falls as products reprice after the market moves; how far, against the federal funds rate, is the deposit beta.
    synonyms: [cost of deposits, deposit cost, cost of shares, share cost, rate paid, deposit rate, dividend rate, interest paid on deposits, deposit pricing, what we pay on deposits]
    owner: Finance data team
    dimensions_allowed: [branch, region, deposit_category]
  new_loan_yield:
    label: Yield on new loans
    type: ratio
    numerator: new_loan_rate_weighted
    denominator: new_loan_amount_sum
    format: rate
    description: Rate on loans made in the period, weighted by amount. Against the portfolio's average rate, it shows whether new lending lifts or dilutes the book's yield. Complete months only.
    synonyms: [new loan yield, yield on new loans, new production yield, production yield, rate on new loans, new loan rate, origination rate, pricing on new loans]
    owner: Lending data team
    dimensions_allowed: [branch, region, loan_category, origination_channel]
  loan_to_share_ratio:
    label: Loan-to-share ratio
    labels_by_type: { bank: Loan-to-deposit ratio }
    type: ratio
    numerator: loan_balance_sum
    denominator: deposit_balance_sum
    format: percent_1
    description: Total loans divided by total shares and deposits, from month-end balances. Most credit unions run 70% to 90%; higher leaves little room to lend or absorb outflows, lower means shares are not being put to work. Institution level only, because branch ratios mislead.
    regulatory_basis: NCUA basis - total loans and leases (5300 account 025B) divided by total shares and deposits (018).
    synonyms: [loan to share, loan to deposit, loan-to-share, loan-to-deposit, ltd, lts, ltd ratio, lts ratio]
    owner: Finance data team
    dimensions_allowed: []
  loans_per_member:
    label: Average loans per member
    labels_by_type: { bank: Average loans per customer }
    type: ratio
    numerator: loan_balance_sum
    denominator: member_count
    format: currency
    description: Total loan balance divided by the number of members. Institution level only, because members and loans are counted at different branches.
    synonyms: [loans per member, average loans per member, loans per customer, average loan per member]
    owner: Finance data team
    dimensions_allowed: []
  deposits_per_member:
