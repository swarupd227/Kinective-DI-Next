  auto: auto
  bus: business
  cd: certificate
  chk: checking
  dda: checking
  heloc: home equity line
  ira: ira
  mma: money market
  mm: money market
  mort: mortgage
  mtg: mortgage
  sav: savings
  shr: share savings
  smb: small business
  ya: young adult

