# Local infrastructure for DI Next. The tenant warehouse is MySQL 8, matching today's DI and the
# planned Azure Database for MySQL (spec 5.7 design decision 3, assumption AS-001).
services:
  mysql:
    image: mysql:8.4
    container_name: dinext-mysql
    environment:
      MYSQL_ROOT_PASSWORD: dinext_local_root
      MYSQL_USER: dinext
      MYSQL_PASSWORD: dinext_local
    ports:
      - '3307:3306'
    volumes:
      - dinext-mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-pdinext_local_root']
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  dinext-mysql:
